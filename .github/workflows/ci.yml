name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Docs reference is up to date
        run: |
          make docs-reference
          git diff --exit-code -- docs || (echo "::error::Run make docs-reference and commit the result" && exit 1)

