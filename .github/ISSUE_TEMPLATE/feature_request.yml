name: Feature request
description: Suggest a change or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does proof get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The command, flag or screen you have in mind. Example output helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
