name: Tempo
options:
  bundleIdPrefix: dev.proof.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
targets:
  Tempo:
    type: application
    platform: iOS
    sources: [Tempo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.proof.example.Tempo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  TempoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TempoTests]
    dependencies:
      - target: Tempo
schemes:
  Tempo:
    build:
      targets:
        Tempo: all
    test:
      targets: [TempoTests]
